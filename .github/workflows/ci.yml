name: verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        target: [js, wasm-gc, native]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: hustcer/setup-moonbit@618b32d610fecdbe9069cefcc01b7bcdb03ede29 # v1.26
        with:
          version: '0.10.20+65efd5b93'
          core-version: '0.10.20+65efd5b93'
      - run: moon check --target ${{ matrix.target }} --deny-warn
      - run: moon test --target ${{ matrix.target }}
      - run: moon info
      - run: node scripts/build.mjs
      - run: node scripts/verify.mjs
      - run: node scripts/security.mjs
      - run: node cli.mjs examples/interface.fc --input pkg.generated.mbti
      - run: node cli.mjs examples/regexp-interface.fc --input vendor/regexp/pkg.generated.mbti
  differential:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.tools/oracle-target
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: hustcer/setup-moonbit@618b32d610fecdbe9069cefcc01b7bcdb03ede29 # v1.26
        with:
          version: '0.10.20+65efd5b93'
          core-version: '0.10.20+65efd5b93'
      - run: cargo build --release --locked --manifest-path reference/oracle/Cargo.toml
      - run: node scripts/build.mjs
      - run: node scripts/verify.mjs
